version = 1
command = "auth.roles.grant"
program = "the8020/auth/command-grant"
summary = "Set an action permission"
description = "Set an action permission using values, patterns, ranges, exclusions and comparisons. Double-quote literal text containing special characters. Use --attribute to take the values from each assignment's attribute of that name."
usage = "<role> <action> <values|attribute> [--attribute]"
mutates_state = true
restart_behavior = "none"
