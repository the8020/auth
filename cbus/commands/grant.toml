version = 1
command = "auth.roles.grant"
program = "the8020/auth/command-grant"
summary = "Set an action permission"
description = "Set an action permission. Use --comparisons after values to enable comparison operators for this entry, or --attribute to take the values from each assignment's attribute of that name."
usage = "<role> <action> <values|attribute> [--comparisons | --attribute]"
mutates_state = true
restart_behavior = "none"
